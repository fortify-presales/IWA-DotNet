# Example SAST, DAST ans SCA security using OpenText Application Security Core
#
# In order for the pipeline to execute successfully you should create and set the following variables in the Pipeline UI.
# 
# For FoD:
#   FOD_URL                       - FoD Base Url, e.g. "https://ams.fortify.com"
#   FOD_CLIENT_ID                 - FoD API Client Id
#   FOD_CLIENT_SECRET             - FoD API Client Secret
#   FOD_APP_NAME_POSTFIX          - A postfix string to apply to the application to make it unique, set to empty to use DEFAULT_APP_NAME
#   FOD_RELEASE_NAME              - FoD Release Name (if not specified, a name will be generated based on project and branch)
#   FOD_PARENT_RELEASE            - FoD Parent Release Name (if applicable)
#   FOD_DEFAULT_OWNER             - FoD Application Owner
#   FOD_DEFAULT_ASSESSMENT_TYPE   - FoD Assessment Type, e.g. "Static Assessment"
#   FOD_DAST_ASSESSMENT_TYPE_ID   - FoD DAST Automated Assessment Type Id (if using DAST Automated)
#   FOD_ENTITLEMENT_ID            - FoD Entitlement Id (if using DAST Automated)
#
# For Azure Deployment:
#   AZURE_SERVICE_CONNECTION      - Name of the Azure Service Connection configured in the Pipeline
#
# The pipeline job templates make use of the Fortify CLI tool (https://github.com/fortify/fcli) to interact with FoD.

name: OpenText-AppSec-Core

trigger:
  batch: "true"
  branches:
    include:
    - main
    - master
    - develop
    - feature/*
    - release/*
    exclude:
    - experimental/*
  paths:
    exclude:
    - README.md
    - bin/*
    - etc/*
    - media/*

pr:
  branches:
    include:
    - main
    - master
    - develop
  paths:
    exclude:
    - README.md
    - bin/*
    - etc/*
    - media/*
  
variables:
# Change these variables depending on which parts of the pipeline to execute:
- name: BUILD_AND_UNIT_TEST
  value: "true"
- name: USE_FOD_SAST
  value: "true"
- name: USE_FOD_DAST
  value: "false"
- name: DEPLOY_TO_AZURE
  value: "false"

#
# By default the FoD application name is set to the name of the Git repository
# By default the FoD release name is set to the name of the Git branch
# If you wish to override any of these please set the following variables from the pipelines UI:
#
# FORTIFY_APP_NAME_OVERRIDE
# FORTIFY_RELEASE_NAME_OVERRIDE
#
- name: FORTIFY_APP_NAME
  value: $(Build.Repository.Name)
- name: FORTIFY_RELEASE_NAME
  value: $[replace(variables['Build.SourceBranch'], 'refs/heads/', '')]

stages:

#
# Setup: compute and publish variables for other stages
#
- stage: Setup
  displayName: 'Setup'
  jobs:
  - job: SetupJob
    displayName: 'Set Fortify App and Release'
    pool:
      #vmImage: 'windows-latest'
      name: 'Default'
    steps:
    - checkout: self
      persistCredentials: "true"
      clean: "true"
    - task: PowerShell@2
      name: SetAppAndRelease
      inputs:
        targetType: 'inline'
        script: |
          $ErrorActionPreference = "Stop"
            
          # Prefer pipeline override variable FORTIFY_APP_NAME if set; fallback to repo name
          if ($env:FORTIFY_APP_NAME_OVERRIDE) {
            $appName = $env:FORTIFY_APP_NAME_OVERRIDE
            if ($env:FOD_APP_NAME_POSTFIX) {
              $appName += $env:FOD_APP_NAME_POSTFIX
            }
          } else {
            $appName = $env:BUILD_REPOSITORY_NAME
            if ($env:FOD_APP_NAME_POSTFIX) {
              $appName += $env:FOD_APP_NAME_POSTFIX
            }
          }

          # Determine release name: use override if present; otherwise build from PR or branch
          if ($env:FORTIFY_RELEASE_NAME_OVERRIDE) {
            $relName = $env:FORTIFY_RELEASE_NAME_OVERRIDE
          } else {
            if ($env:BUILD_REASON -eq "PullRequest") {
              $relName = $env:SYSTEM_PULLREQUEST_PULLREQUESTID
            } else {
              $relName = $env:BUILD_SOURCEBRANCHNAME
            }
          }

          $appAndRelName = "${appName}:${relName}"

          Write-Host "Setting FORTIFY_APP_NAME to $appName"
          Write-Host "Setting FORTIFY_RELEASE_NAME to $relName"
          Write-Host "Setting FORTIFY_APP_AND_RELEASE_NAME to $appAndRelName"
          Write-Host "##vso[task.setvariable variable=FORTIFY_APP_NAME;isOutput=true]$appName"
          Write-Host "##vso[task.setvariable variable=FORTIFY_RELEASE_NAME;isOutput=true]$relName"
          Write-Host "##vso[task.setvariable variable=FORTIFY_APP_AND_RELEASE_NAME;isOutput=true]$appAndRelName"

#
# Build and Unit Test the application components
#
- stage: Build_And_Unit_Test
  displayName: 'Build and Unit Test'
  condition: and(succeeded(), eq(variables['BUILD_AND_UNIT_TEST'], 'true'))
  jobs:
  - job: Build
    pool:
      #vmImage: 'windows-latest'
      name: 'Default'
      steps:
      - checkout: self
        persistCredentials: "true"
        clean: "true"
      - task: UseDotNet@2
        inputs:
          version: '9.x'
      - task: DotNetCoreCLI@2
        displayName: 'dotnet build'
        inputs:
          command: 'build'
          configuration: 'Debug'
          projects: 'InsecureWebApp/InsecureWebApp.csproj'
      - task: DotNetCoreCLI@2
        displayName: 'dotnet test'
        inputs:
          command: 'test'
          configuration: 'Debug'
          projects: 'InsecureWebAppTests/InsecureWebAppTests.csproj'

#
# FoD SAST and SCA
#  
- stage: FoD_SAST_and_SCA
  displayName: 'FoD SAST and SCA'
  condition: and(succeeded(), eq(variables['USE_FOD_SAST'], 'true'))
  dependsOn:
  - Setup
  - Build_And_Unit_Test 
  jobs:
  - job: Fortify_CLI_Scan
    displayName: 'Run FOD SAST and SCA Scan via Fortify CLI'
    pool:
      #vmImage: 'windows-latest'
      name: 'Default'
      variables:
      - name: FOD_RELEASE_FROM_SETUP
        value: $[ stageDependencies.Setup.SetupJob.outputs['SetAppAndRelease.FORTIFY_APP_AND_RELEASE_NAME'] ]
      steps:
      - checkout: self
        persistCredentials: "true"
        clean: "true"
      - task: PowerShell@2
        displayName: 'Install Fortify CLI via @fortify/setup'
        inputs:
          targetType: 'inline'
          workingDirectory: '$(Build.SourcesDirectory)\InsecureWebApp'
          script: |
            npx @fortify/setup@v2 env init --tools=fcli:bootstrapped
            npx @fortify/setup@v2 env ado
      - task: PowerShell@2
        displayName: 'Run FoD CI Scan'
        inputs:
          targetType: 'inline'
          workingDirectory: '$(Build.SourcesDirectory)\InsecureWebApp'
          script: |
            $ErrorActionPreference = "Stop"
            fcli action run ci
        env:
          FOD_URL: $(FOD_URL)
          FOD_CLIENT_ID: $(FOD_CLIENT_ID)
          FOD_CLIENT_SECRET: $(FOD_CLIENT_SECRET)
          FOD_RELEASE: $(FOD_RELEASE_FROM_SETUP)
          COPY_FROM_RELEASE: "$(FOD_PARENT_RELEASE)"
          SAST_ASSESSMENT_TYPE: "$(FOD_DEFAULT_ASSESSMENT_TYPE)"
          SETUP_EXTRA_OPTS: '--sdlc-status Development --app-owner "$(FOD_DEFAULT_OWNER)"'
          PACKAGE_EXTRA_OPTS: "-bt dotnet -bf InsecureWebApp.csproj"
          DO_SETUP: true
          DO_SAST_SCAN: true
          DO_AVIATOR_AUDIT: true
          DO_SCA_SCAN: true
          DO_WAIT: true
          SAST_WAIT_EXTRA_OPTS: --timeout 2h
          DO_POLICY_CHECK: false  # we will do policy check in a separate job after DAST scan
          DO_JOB_SUMMARY: true
          DO_PR_COMMENT: true
          DO_EXPORT: true

#
# Deploy to Azure App Service
#
- stage: Deploy_to_Azure_App_Service
  displayName: 'Deploy to Azure App Service'
  condition: and(succeeded(), eq(variables['DEPLOY_TO_AZURE'], 'true'), eq(variables['Build.SourceBranchName'], 'main'))
  dependsOn:
  - Setup
  - Build_And_Unit_Test
  - FoD_SAST_and_SCA
  jobs:
  - deployment: Deploy
    displayName: 'Deploy to Azure App Service'
    environment: 'development'
    pool:
      #vmImage: 'windows-latest'
      name: 'Default'
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self
              persistCredentials: "true"
              clean: "true"
            - task: UseDotNet@2
              inputs:
                version: '9.x'
            - task: DotNetCoreCLI@2
              displayName: 'Run dotnet publish'
              inputs:
                command: 'publish'
                projects: 'InsecureWebApp/InsecureWebApp.csproj'
                configuration: 'Debug'
                arguments: '--output $(Build.ArtifactStagingDirectory)/publish'
            - task: ArchiveFiles@2
              displayName: 'Zip published output'
              inputs:
                rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
                includeRootFolder: false
                archiveType: 'zip'
                archiveFile: '$(Build.ArtifactStagingDirectory)/InsecureWebApp.zip'
                replaceExistingArchive: true
            #- task: AzureWebApp@1
            #  displayName: 'Deploy Web App'
            #  inputs:
            #    azureSubscription: $(AZURE_SERVICE_CONNECTION)
            #    appType: 'webAppLinux'
            #    appName: 'iwadotnet'
            #    package: '$(Build.ArtifactStagingDirectory)/publish'
            #    deploymentMethod: 'zipDeploy'
            #    startupCommand: 'dotnet InsecureWebApp.dll'

#
# FOD DAST
#
- stage: FoD_DAST
  displayName: 'FoD DAST'
  condition: >-
    and(
      eq(variables['USE_FOD_DAST'], 'true'),
      eq(variables['Build.SourceBranchName'], 'main'),
      eq(dependencies.Build_And_Unit_Test.result, 'succeeded'),
      or(
        eq(dependencies.Deploy_to_Azure_App_Service.result, 'succeeded'),
        eq(dependencies.Deploy_to_Azure_App_Service.result, 'skipped')
      )
    )
  dependsOn:
  - Setup
  - Deploy_to_Azure_App_Service
  jobs:
  - job: Fortify_CLI_DAST_Scan
    displayName: 'Run FoD DAST Scan via Fortify CLI'
    pool:
      #vmImage: 'windows-latest'
      name: 'Default'
    variables:
    - name: FOD_RELEASE_FROM_SETUP
      value: $[ stageDependencies.Setup.SetupJob.outputs['SetAppAndRelease.FORTIFY_APP_AND_RELEASE_NAME'] ]
    steps:
    - checkout: self
      persistCredentials: "true"
      clean: "true"
    - task: PowerShell@2
      displayName: 'Install Fortify CLI via @fortify/setup'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(Build.SourcesDirectory)\InsecureWebApp'
        script: |
          npx @fortify/setup@v2 env init --tools=fcli:bootstrapped
          npx @fortify/setup@v2 env ado
    - task: PowerShell@2
      displayName: 'Run FoD DAST Scan'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(Build.SourcesDirectory)\InsecureWebApp'
        script: |
          $ErrorActionPreference = "Stop"
          Write-Host "Running FoD DAST Scan for release: $env:FOD_RELEASE"
          Write-Host "Logging in to FoD..."
          fcli fod session login --url "$env:FOD_URL" --client-id "$env:FOD_CLIENT_ID" --client-secret "$env:FOD_CLIENT_SECRET" --fod-session ado-pipeline
          Write-Host "Starting DAST scan for release: $env:FOD_RELEASE"
          fcli fod dast-scan start --release "$env:FOD_RELEASE" --in-progress "Queue" --store curScan --fod-session ado-pipeline
          Start-Sleep -Seconds 10
          fcli fod dast-scan wait-for ::curScan:: --fod-session ado-pipeline
          Write-Host "DAST scan completed. Logging out..."
          fcli fod session logout --fod-session ado-pipeline
      env:
        FOD_URL: $(FOD_URL)
        FOD_CLIENT_ID: $(FOD_CLIENT_ID)
        FOD_CLIENT_SECRET: $(FOD_CLIENT_SECRET)
        FOD_RELEASE: $(FOD_RELEASE_FROM_SETUP)

- stage: Completion
  displayName: 'Pipeline Complete'
  condition: always()
  dependsOn:
  - Setup
  - Build_And_Unit_Test
  - FoD_SAST_and_SCA
  - Deploy_to_Azure_App_Service
  - FoD_DAST
  jobs:
  - job: Fortify_Reports
    displayName: 'Generate Fortify Reports'
    pool:
      #vmImage: 'windows-latest'
      name: 'Default'
    variables:
    - name: FOD_APP_FROM_SETUP
      value: $[ stageDependencies.Setup.SetupJob.outputs['SetAppAndRelease.FORTIFY_APP_NAME'] ]
    - name: FOD_RELEASE_FROM_SETUP
      value: $[ stageDependencies.Setup.SetupJob.outputs['SetAppAndRelease.FORTIFY_RELEASE_NAME'] ]
    - name: FOD_APP_AND_RELEASE_FROM_SETUP
      value: $[ stageDependencies.Setup.SetupJob.outputs['SetAppAndRelease.FORTIFY_APP_AND_RELEASE_NAME'] ]
    steps:
    - checkout: self
      persistCredentials: "true"
      clean: "true"
    - task: PowerShell@2
      displayName: 'Install Fortify CLI via @fortify/setup'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(Build.SourcesDirectory)\InsecureWebApp'
        script: |
          npx @fortify/setup@v2 env init --tools=fcli:bootstrapped
          npx @fortify/setup@v2 env ado
    - task: PowerShell@2
      displayName: 'Publish Markdown Summary'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(Build.SourcesDirectory)\InsecureWebApp'
        script: |
          $ErrorActionPreference = "Stop"
          Write-Host "Publishing Markdown Summary for release: $env:FOD_RELEASE"
          Write-Host "Logging in to FoD..."
          fcli fod session login --url "$env:FOD_URL" --client-id "$env:FOD_CLIENT_ID" --client-secret "$env:FOD_CLIENT_SECRET" --fod-session ado-pipeline
          fcli fod action run release-summary --release "$env:FOD_RELEASE" -f release-summary.md --fod-session ado-pipeline
          # Upload the summary only if it exists; use absolute path to ensure agent can find it
          if (Test-Path release-summary.md) {
            $summaryPath = Join-Path (Get-Location) "release-summary.md"
            Write-Host "Found summary at $summaryPath, uploading to pipeline UI"
            Write-Host "##vso[task.uploadsummary]$summaryPath"
          } else {
            Write-Host "Warning: release-summary.md not found in $(Get-Location). Skipping upload."
          }
          Write-Host "Publishing Markdown Summary completed. Logging out..."
          fcli fod session logout --fod-session ado-pipeline
      env:
        FOD_URL: $(FOD_URL)
        FOD_CLIENT_ID: $(FOD_CLIENT_ID)
        FOD_CLIENT_SECRET: $(FOD_CLIENT_SECRET)
        FOD_RELEASE: $(FOD_APP_AND_RELEASE_FROM_SETUP)
    - script: echo "DevSecOps Pipeline Complete!"